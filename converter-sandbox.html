<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-S0dhv/RhRHC4bT9H9LHQYElzZCn7OrBEt4fuQFG6WoM=' blob:; connect-src 'none'; img-src 'none'; style-src 'none'; font-src 'none'; media-src 'none'; worker-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>WAVEFRAME 98 isolated converter</title>
</head>
<body>
<script>
(()=>{'use strict';
let worker=null,currentId=0,cancelRequested=false,workerReady=false,workerHasLame=false,pendingResolve=null,pendingReject=null,currentFile=null,currentFormat='m4a',currentEngines=null,jobWatchdog=null;
const send=data=>{try{parent.postMessage(data,'*')}catch(_){}};
const progress=(id,message,percent)=>send({type:'progress',id,message:String(message||'변환 중…').slice(0,180),percent:Math.max(0,Math.min(100,Number(percent)||0))});
const WORKER_SOURCE = String.raw`'use strict';
let mp4box=null,lame=null,cancelled=false,currentParser=null;
const out=(data)=>postMessage(data);
const fail=(id,error)=>out({type:'error',id,message:String(error&&error.message||error||'변환 실패').slice(0,400)});
async function init(data){
 try{
  const mp4url=URL.createObjectURL(data.mp4box);importScripts(mp4url);URL.revokeObjectURL(mp4url);
  mp4box=self.MP4Box||self.mp4box;if(!mp4box||typeof mp4box.createFile!=='function')throw new Error('MP4 처리 라이브러리 API를 찾지 못했습니다.');
  if(data.lame){const lameurl=URL.createObjectURL(data.lame);importScripts(lameurl);URL.revokeObjectURL(lameurl);lame=self.lamejs||self.LameJS;if(!lame||typeof lame.Mp3Encoder!=='function')throw new Error('MP3 인코더 API를 찾지 못했습니다.');}
  out({type:'ready'});
 }catch(error){fail(0,error)}
}
async function extract(file,id){
 cancelled=false;
 try{
  out({type:'progress',id,message:'MP4 오디오 트랙을 분석하는 중…',percent:12});
  const data=await file.arrayBuffer();data.fileStart=0;
  const result=await new Promise((resolve,reject)=>{
   let mp4,track=null,initBuffer=null,parts=[],ready=false,flushed=false,settled=false;
   const timeout=setTimeout(()=>finish(new Error('MP4 분석 시간이 너무 오래 걸려 중단했어요.')),90000);
   const finish=err=>{
    if(settled)return;if(cancelled)err=new Error('사용자가 변환을 취소했습니다.');
    if(err){settled=true;clearTimeout(timeout);try{mp4?.stop?.()}catch(_){}if(currentParser===mp4)currentParser=null;reject(err);return;}
    if(!ready||!flushed)return;
    if(!initBuffer||!parts.length){settled=true;clearTimeout(timeout);reject(new Error('오디오 샘플을 추출하지 못했어요. MP4 오디오 코덱을 확인해 주세요.'));return;}
    settled=true;clearTimeout(timeout);if(currentParser===mp4)currentParser=null;
    resolve({blob:new Blob([initBuffer,...parts],{type:'audio/mp4'}),track});
   };
   try{
    mp4=mp4box.createFile(true);currentParser=mp4;
    mp4.onError=err=>finish(new Error('MP4 분석 실패: '+String(err||'알 수 없는 오류').slice(0,180)));
    mp4.onReady=info=>{
     try{
      track=(info.tracks||[]).find(t=>t.audio);
      if(!track){finish(new Error('이 MP4에서 오디오 트랙을 찾지 못했어요.'));return;}
      if(!/^mp4a\.40\./i.test(track.codec||'')){finish(new Error('현재 원본 추출은 AAC 오디오가 들어 있는 MP4를 지원해요. 감지된 코덱: '+(track.codec||'알 수 없음')));return;}
      mp4.setSegmentOptions(track.id,'waveframe-audio',{nbSamples:1000,rapAlignement:false});
      const initSegments=mp4.initializeSegmentation('per-track')||[];const init=initSegments.find(item=>item.id===track.id)||initSegments[0];initBuffer=init?.buffer||null;
      if(!initBuffer){finish(new Error('오디오 전용 M4A 헤더를 만들지 못했어요.'));return;}
      mp4.onSegment=(tid,user,buffer)=>{if(tid===track.id&&buffer)parts.push(buffer.slice?buffer.slice(0):buffer);};
      mp4.start();ready=true;finish();
     }catch(error){finish(error);}
    };
    mp4.appendBuffer(data);mp4.flush();flushed=true;finish();
   }catch(error){finish(error);}
  });
  if(cancelled)throw new Error('사용자가 변환을 취소했습니다.');
  out({type:'extracted',id,blob:result.blob,track:{codec:result.track.codec,audio:result.track.audio||{},duration:result.track.duration,timescale:result.track.timescale}});
 }catch(error){fail(id,error)}
}
function nearestRate(rate){const list=[48000,44100,32000,24000,22050,16000,12000,11025,8000];return list.reduce((best,v)=>Math.abs(v-rate)<Math.abs(best-rate)?v:best,list[0]);}
async function encode(msg){
 const id=msg.id;
 try{
  if(!lame||!lame.Mp3Encoder)throw new Error('MP3 인코더가 준비되지 않았습니다.');
  cancelled=false;
  const rate=nearestRate(Number(msg.sampleRate)||44100),channels=msg.right?2:1;
  const encoder=new lame.Mp3Encoder(channels,rate,320),left=msg.left,right=msg.right,chunks=[],block=1152,total=left.length;
  const toInt16=(src,offset,count)=>{const out=new Int16Array(count);for(let i=0;i<count;i++){const v=src[offset+i]||0;out[i]=v<0?Math.max(-32768,Math.round(v*32768)):Math.min(32767,Math.round(v*32767));}return out;};
  for(let offset=0;offset<total;offset+=block){
   if(cancelled)throw new Error('사용자가 변환을 취소했습니다.');
   const count=Math.min(block,total-offset),l=toInt16(left,offset,count);let encoded;
   if(right){const r=toInt16(right,offset,count);encoded=encoder.encodeBuffer(l,r);}else encoded=encoder.encodeBuffer(l);
   if(encoded&&encoded.length)chunks.push(encoded);
   const pct=65+(offset/Math.max(1,total))*33;
   if(offset===0||offset%(block*64)===0){out({type:'progress',id,message:'MP3 320kbps 인코딩 중… '+Math.round((offset/Math.max(1,total))*100)+'%',percent:pct});await new Promise(resolve=>setTimeout(resolve,0));}
  }
  if(cancelled)throw new Error('사용자가 변환을 취소했습니다.');
  const tail=encoder.flush();if(tail&&tail.length)chunks.push(tail);
  out({type:'mp3done',id,blob:new Blob(chunks,{type:'audio/mpeg'})});
 }catch(error){fail(id,error)}
}
onmessage=event=>{const m=event.data||{};if(m.type==='init')init(m);else if(m.type==='extract'&&Number.isSafeInteger(m.id))extract(m.file,m.id);else if(m.type==='encode'&&Number.isSafeInteger(m.id))encode(m);else if(m.type==='cancel'){cancelled=true;try{currentParser&&currentParser.stop&&currentParser.stop()}catch(_){}}};`;
function ensureWorker(engines){
 if(worker&&workerReady&&(!engines.lame||workerHasLame))return Promise.resolve();
 return new Promise((resolve,reject)=>{
  let settled=false;const timer=setTimeout(()=>{if(settled)return;settled=true;reject(new Error('격리 변환 Worker를 시작하지 못했습니다.'));},15000);
  const finish=error=>{if(settled)return;settled=true;clearTimeout(timer);error?reject(error):resolve();};
  try{
   if(worker){worker.terminate();worker=null;workerReady=false;workerHasLame=false;}
   const source=new Blob([WORKER_SOURCE],{type:'text/javascript'}),url=URL.createObjectURL(source);
   worker=new Worker(url);URL.revokeObjectURL(url);
   worker.onmessage=async event=>{
    const m=event.data||{};
    if(m.type==='ready'){workerReady=true;finish();return;}
    if(m.type==='error'){const error=new Error(String(m.message||'변환 Worker 오류').slice(0,400));if(m.id===0){finish(error);return;}clearTimeout(jobWatchdog);send({type:'error',id:m.id,message:error.message});currentFile=null;currentEngines=null;pendingReject?.(error);pendingResolve=pendingReject=null;return;}
    if(m.type==='progress'){progress(m.id,m.message,m.percent);return;}
    if(m.type==='extracted'){
     if(m.id!==currentId)return;
     try{
      if(currentFormat==='m4a'){clearTimeout(jobWatchdog);send({type:'done',id:m.id,blob:m.blob});currentFile=null;currentEngines=null;pendingResolve?.();pendingResolve=pendingReject=null;return;}
      progress(m.id,'오디오를 기기 내부에서 디코딩하는 중…',60);
      const Context=self.AudioContext||self.webkitAudioContext;if(!Context)throw new Error('이 브라우저는 오디오 변환을 지원하지 않습니다.');
      const target=nearestRate(Number(m.track?.audio?.sample_rate)||44100);let context,decoded=null,lastError=null;
      try{
       context=new Context({sampleRate:target});
       for(const source of [currentFile,m.blob].filter(Boolean)){
        try{decoded=await context.decodeAudioData(await source.arrayBuffer());if(decoded?.length)break;}catch(error){lastError=error;}
       }
       if(!decoded)throw lastError||new Error('Audio decode failed');
       let audioBuffer=decoded;const channels=decoded.numberOfChannels===1?1:2;
       if(decoded.sampleRate!==target||decoded.numberOfChannels>2){
        const Offline=self.OfflineAudioContext||self.webkitOfflineAudioContext;if(!Offline)throw new Error('이 기기는 샘플레이트/채널 변환을 지원하지 않습니다.');
        const off=new Offline(channels,Math.ceil(decoded.duration*target),target),src=off.createBufferSource();src.buffer=decoded;src.connect(off.destination);src.start();audioBuffer=await off.startRendering();
       }
       const left=audioBuffer.getChannelData(0).slice(),right=channels>1?audioBuffer.getChannelData(1).slice():null;
       if(cancelRequested)throw new Error('사용자가 변환을 취소했습니다.');
       worker.postMessage({type:'encode',id:m.id,sampleRate:target,left,right},right?[left.buffer,right.buffer]:[left.buffer]);
      }finally{try{await context?.close();}catch(_){}}
     }catch(error){
      let message=String(error?.message||error||'오디오 디코딩 실패');
      if(/decode|encoding/i.test(message))message='이 브라우저가 MP4의 AAC 오디오를 PCM으로 읽지 못했어요. 원본 추출 M4A는 저장할 수 있습니다.';
      clearTimeout(jobWatchdog);send({type:'error',id:m.id,message});currentFile=null;currentEngines=null;pendingReject?.(new Error(message));pendingResolve=pendingReject=null;
     }
     return;
    }
    if(m.type==='mp3done'&&m.id===currentId){clearTimeout(jobWatchdog);send({type:'done',id:m.id,blob:m.blob});currentFile=null;currentEngines=null;pendingResolve?.();pendingResolve=pendingReject=null;}
   };
   worker.onerror=event=>{const error=new Error('격리 변환 Worker 오류: '+String(event.message||'알 수 없는 오류').slice(0,180));finish(error);try{worker?.terminate()}catch(_){}worker=null;workerReady=false;workerHasLame=false;pendingReject?.(error);pendingResolve=pendingReject=null;};
   workerHasLame=!!engines.lame;worker.postMessage({type:'init',mp4box:engines.mp4box,lame:engines.lame||null});
  }catch(error){finish(error);}
 });
}
async function convert(msg){
 const {id,file,format,engines}=msg;currentId=id;currentFile=file;currentFormat=format;currentEngines=engines;cancelRequested=false;
 try{
  if(!file||typeof file.size!=='number'||file.size<16||file.size>200*1024*1024)throw new Error('파일 크기 또는 형식이 허용 범위를 벗어났습니다.');
  if(!engines?.mp4box||engines.mp4box.size>3*1024*1024)throw new Error('MP4 처리 라이브러리가 없습니다.');
  if(format==='mp3'&&(!engines.lame||engines.lame.size>3*1024*1024))throw new Error('MP3 인코더가 없습니다.');
  progress(id,'네트워크가 차단된 변환 Worker를 시작하는 중…',9);
  await ensureWorker(engines);
  if(cancelRequested)throw new Error('사용자가 변환을 취소했습니다.');
  clearTimeout(jobWatchdog);jobWatchdog=setTimeout(()=>{if(currentId!==id)return;try{worker?.terminate()}catch(_){}worker=null;workerReady=false;workerHasLame=false;currentFile=null;currentEngines=null;send({type:'error',id,message:'변환 시간이 너무 길어 안전을 위해 중단했어요. MP4 크기를 줄이거나 다시 시도해 주세요.'});},600000);
  progress(id,'격리된 Worker에서 MP4 오디오를 추출합니다…',12);
  worker.postMessage({type:'extract',id,file});
 }catch(error){clearTimeout(jobWatchdog);send({type:cancelRequested?'cancelled':'error',id,message:String(error?.message||error||'변환 실패').slice(0,400)});currentFile=null;currentEngines=null;pendingReject?.(error);pendingResolve=pendingReject=null;}
}
window.addEventListener('message',event=>{
 if(event.source!==parent)return;const msg=event.data;if(!msg||typeof msg!=='object')return;
 if(msg.type==='ping'){send({type:'ready'});return;}
 if(msg.type==='cancel'&&msg.id===currentId){cancelRequested=true;clearTimeout(jobWatchdog);try{worker?.terminate()}catch(_){}worker=null;workerReady=false;workerHasLame=false;currentFile=null;currentEngines=null;send({type:'cancelled',id:msg.id,message:'사용자가 변환을 취소했습니다.'});return;}
 if(msg.type==='convert'&&Number.isSafeInteger(msg.id)&&(!currentId||currentId!==msg.id)){
  pendingResolve=pendingReject=null;
  convert(msg);
 }
});
send({type:'booted'});
})();
</script>
